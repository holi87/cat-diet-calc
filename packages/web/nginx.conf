server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Baseline security headers (note: nginx drops inherited add_header in any
    # location that sets its own — sw.js/manifest/assets below intentionally
    # manage only cache headers)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy /api → catcal-api (lokalnie i za Traefik)
    location /api/ {
        # Fastify accepts 50 MB on /api/import/json — without this nginx caps
        # request bodies at 1 MB and the backup restore dies with 413 in prod
        client_max_body_size 50m;
        proxy_pass http://catcal-api:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Service worker — must never be cached
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate";
        add_header Pragma "no-cache";
        try_files $uri =404;
    }

    # PWA manifest — short cache
    location = /manifest.webmanifest {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    # App shell — browsers must revalidate after a deploy, or a cached
    # index.html keeps pointing at asset hashes that no longer exist
    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback — all routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|svg|ico|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
}
