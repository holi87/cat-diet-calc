services:
  catcal-db:
    image: postgres:16-alpine
    container_name: catcal-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - catcal-db-data:/var/lib/postgresql/data
    networks:
      - catcal-net
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  catcal-api:
    build:
      context: ./packages/api
      dockerfile: Dockerfile
    container_name: catcal-api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: production
      # Seed runs only when explicitly requested (first deploy on a fresh DB)
      RUN_SEED: ${RUN_SEED:-false}
    depends_on:
      catcal-db:
        condition: service_healthy
    networks:
      - catcal-net
    ports:
      - "8101:4000"

  catcal-web:
    build:
      context: ./packages/web
      dockerfile: Dockerfile
    container_name: catcal-web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      catcal-api:
        # Dockerfile HEALTHCHECK pings /api/health
        condition: service_healthy
    networks:
      - catcal-net
    ports:
      - "8100:80"

volumes:
  catcal-db-data:

networks:
  catcal-net:
    driver: bridge
